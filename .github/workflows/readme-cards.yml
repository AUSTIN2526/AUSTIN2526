name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 08:00（台灣時間）更新一次
  workflow_dispatch:       # 也可以在 Actions 頁面手動執行
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

# README_STATS_TOKEN：Classic PAT（不需勾任何權限），存在 repo 的 Actions secrets

permissions:
  contents: write

# 同時只跑一個，避免兩次執行互相搶著 push
concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Trophy (light + dark)
        env:
          GITHUB_TOKEN1: ${{ secrets.README_STATS_TOKEN }}
        run: |
          git clone -q --depth 1 --branch v1 https://github.com/ttiimmothy/github-readme-trophy-stats.git /tmp/trophy
          cat > /tmp/trophy/gen.ts <<'TS'
          import { GithubApiService } from "./src/Services/GithubApiService.ts";
          import { Card } from "./src/card.ts";
          import { COLORS } from "./src/theme.ts";

          const out = Deno.args[0];
          const info: any = await new GithubApiService().requestUserInfo("AUSTIN2526");
          if (!(info && info.totalCommits !== undefined)) {
            console.error("Failed to fetch user info", info);
            Deno.exit(2);
          }
          // 只留有意義的獎盃
          const titles = ["Stars", "Followers", "Repositories", "Commits", "Experience"];
          const themes: Record<string, string> = { light: "default", dark: "darkhub" };
          await Deno.mkdir(`${out}/profile`, { recursive: true });
          for (const [mode, theme] of Object.entries(themes)) {
            // titles, ranks, maxColumn, maxRow, panelSize, marginW, marginH, noBackground, noFrame
            const card = new Card(titles, [], -1, 1, 110, 12, 10, true, true);
            await Deno.writeTextFile(`${out}/profile/trophy-${mode}.svg`, card.render(info, (COLORS as any)[theme]));
            console.log(`Wrote profile/trophy-${mode}.svg`);
          }
          TS
          deno run -A /tmp/trophy/gen.ts "$GITHUB_WORKSPACE"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch profile/stats.svg profile/trophy.svg profile/pin-*.svg
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
