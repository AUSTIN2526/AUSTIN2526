name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 08:00（台灣時間）更新一次
  workflow_dispatch:       # 也可以在 Actions 頁面手動執行
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

# README_STATS_TOKEN：fine-grained PAT（Public repositories read-only），存在 repo 的 Actions secrets
# 不能用內建 GITHUB_TOKEN：它只看得到這個 profile repo，讀不到你其他 repo，pin 卡會顯示 Repository Not found

permissions:
  contents: write

# 同時只跑一個，避免兩次執行互相搶著 push
concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=AUSTIN2526&show_icons=true&hide_border=true&title_color=2F81F7&icon_color=2F81F7
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Pin - med-voice-SHI-detector
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=AUSTIN2526&repo=med-voice-SHI-detector&hide_border=true&title_color=2F81F7&icon_color=2F81F7
          path: profile/pin-med-voice-SHI-detector.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Pin - DE-ID-AI-CUP-Trainer
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=AUSTIN2526&repo=DE-ID-AI-CUP-Trainer&hide_border=true&title_color=2F81F7&icon_color=2F81F7
          path: profile/pin-DE-ID-AI-CUP-Trainer.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Pin - learn-NLP-in-30-days-book-version
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=AUSTIN2526&repo=learn-NLP-in-30-days-book-version&hide_border=true&title_color=2F81F7&icon_color=2F81F7
          path: profile/pin-learn-NLP-in-30-days-book-version.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Pin - learn-AI-in-30-days-book-version
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=AUSTIN2526&repo=learn-AI-in-30-days-book-version&hide_border=true&title_color=2F81F7&icon_color=2F81F7
          path: profile/pin-learn-AI-in-30-days-book-version.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Trophy
        uses: ttiimmothy/github-readme-trophy-stats@v1
        with:
          username: AUSTIN2526
          output_path: profile/trophy.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
